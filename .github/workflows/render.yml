name: FE render
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "ID del video (carpeta jobs/<id>)"
        required: true
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JOB_ID: ${{ inputs.job_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion/package-lock.json
      - name: Instalar ffmpeg, fuentes y numpy
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-inter python3-numpy python3-pil python3-fonttools
      - name: Fuente de subtitulos (Barlow Condensed)
        run: |
          mkdir -p ~/.fonts
          curl -fsSL --retry 3 -o ~/.fonts/BarlowCondensed-Bold.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/barlowcondensed/BarlowCondensed-Bold.ttf" || echo "No se pudo bajar Barlow Condensed; se usara Inter Bold"
          curl -sL -o ~/.fonts/Poppins-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf || true
          curl -sL -o ~/.fonts/Poppins-Medium.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Medium.ttf || true
          curl -sL -o ~/.fonts/Poppins-SemiBold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-SemiBold.ttf || true
          curl -sL -o ~/.fonts/PatrickHand-Regular.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/patrickhand/PatrickHand-Regular.ttf || true
          fc-cache -f || true
          fc-list | grep -i "barlow" || true
      - name: Renderizar video
        run: |
          python3 render_fe.py "jobs/${JOB_ID}/job.json" "video-${JOB_ID}.mp4"
      - name: Publicar video en Release
        run: gh release create "v-${JOB_ID}" "video-${JOB_ID}.mp4" --title "video-${JOB_ID}" --notes "FE"
      - name: Limpiar paquete del repositorio
        run: |
          git config user.name "fe-bot"
          git config user.email "fe-bot@users.noreply.github.com"
          git rm -r -q "jobs/${JOB_ID}"
          git commit -m "limpiar jobs/${JOB_ID}"
          for i in 1 2 3 4 5 6; do
            if git pull --rebase -q origin main && git push -q; then break; fi
            sleep $((RANDOM % 8 + 3))
          done
